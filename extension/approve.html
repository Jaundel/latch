<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="ui.css">
  <style>
    body { background: var(--bg); }
    main { padding: 28px 28px 24px; max-width: 440px; margin: 0 auto; }
    .brand { margin-bottom: 22px; }

    p { color: var(--fg-2); margin: 0 0 12px; }

    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
    .foot { margin-top: 14px; font-size: 12px; color: var(--fg-3); text-align: center; }
