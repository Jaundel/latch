<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password · Latch practice site</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="stylesheet" href="demo.css">
  <script src="demo.js" defer></script>
</head>
<body>
  <div class="note">Latch practice site. Nothing you enter here leaves this page. <a href="../">Back to Latch</a></div>
  <div class="nav"><i></i>Practice Co.</div>
  <main>
    <div class="card" id="reset-card">
      <h1>Reset your password</h1>
      <form id="reset" method="post">
        <label>New password <input type="password" name="password" autocomplete="new-password" required></label>
        <label>Confirm new password <input type="password" name="confirm" autocomplete="new-password" required></label>
        <div class="error" role="alert" id="reset-error"></div>
        <button type="submit">Reset password</button>
      </form>
    </div>
    <div class="card" id="done" hidden>
      <h1>Your password has been reset</h1>
      <p class="sub">Latch chose a strong password and saved it for this site. <a href="./">Sign in</a> with your new password.</p>
    </div>
  </main>
</body>
</html>
